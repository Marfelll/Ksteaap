<svg viewBox="0 0 900 700" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&display=swap');
    text{ font-family:'Archivo', sans-serif; }
    .caption{ font-size:13px; font-weight:500; fill:#8B8D92; }
    .word{ font-weight:800; letter-spacing:-0.5px; }
  </style>

  <defs>
    <!-- base mark: three ascending steps + a destination square -->
    <g id="icon-ink">
      <rect x="6"  y="40" width="10" height="14" fill="#15171B"/>
      <rect x="20" y="28" width="10" height="26" fill="#15171B"/>
      <rect x="34" y="16" width="10" height="38" fill="#15171B"/>
      <rect x="34" y="2"  width="10" height="10" fill="#33456E"/>
    </g>
    <g id="icon-white">
      <rect x="6"  y="40" width="10" height="14" fill="#FAFAF7"/>
      <rect x="20" y="28" width="10" height="26" fill="#FAFAF7"/>
      <rect x="34" y="16" width="10" height="38" fill="#FAFAF7"/>
      <rect x="34" y="2"  width="10" height="10" fill="#7C97CC"/>
    </g>
  </defs>

  <!-- canvas -->
  <rect x="0" y="0" width="900" height="700" fill="#FAFAF7"/>
  <text x="60" y="34" class="caption">Kstep — logo marks</text>

  <!-- ============ PANEL 1 — primary lockup ============ -->
  <rect x="60" y="50" width="380" height="240" fill="none" stroke="#E4E2DC"/>
  <use href="#icon-ink" transform="translate(100,118) scale(1.55)"/>
  <text x="195" y="176" font-size="42" class="word">
    <tspan fill="#33456E">K</tspan><tspan fill="#15171B">step</tspan>
  </text>
  <text x="60" y="314" class="caption">Primary lockup, icon and wordmark</text>

  <!-- ============ PANEL 2 — app icon, two sizes ============ -->
  <rect x="460" y="50" width="380" height="240" fill="none" stroke="#E4E2DC"/>
  <rect x="500" y="110" width="120" height="120" rx="24" fill="#15171B"/>
  <use href="#icon-white" transform="translate(526.7,132.7) scale(1.333)"/>
  <rect x="660" y="146" width="48" height="48" rx="10" fill="#15171B"/>
  <use href="#icon-white" transform="translate(670.7,155.1) scale(0.533)"/>
  <text x="460" y="314" class="caption">App icon, at two sizes</text>

  <!-- ============ PANEL 3 — stacked lockup ============ -->
  <rect x="60" y="330" width="380" height="240" fill="none" stroke="#E4E2DC"/>
  <use href="#icon-ink" transform="translate(217.5,357.4) scale(1.3)"/>
  <text x="250" y="480" font-size="34" class="word" text-anchor="middle">
    <tspan fill="#33456E">K</tspan><tspan fill="#15171B">step</tspan>
  </text>
  <text x="60" y="594" class="caption">Stacked lockup, for square formats</text>

  <!-- ============ PANEL 4 — reversed, dark background ============ -->
  <rect x="460" y="330" width="380" height="240" fill="#15171B"/>
  <use href="#icon-white" transform="translate(500,448) scale(1.55)"/>
  <text x="595" y="506" font-size="42" class="word">
    <tspan fill="#7C97CC">K</tspan><tspan fill="#FAFAF7">step</tspan>
  </text>
  <text x="460" y="594" class="caption">Reversed, for dark backgrounds</text>

</svg>
